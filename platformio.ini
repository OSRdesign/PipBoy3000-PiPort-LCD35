; Pip-Boy 3000 cosplay firmware
; Target: Waveshare ESP32-S3-Touch-LCD-3.5 (ST7796 SPI LCD + FT6336 touch, ESP32-S3R8 module)
; Hardware-only fork of PipBoy3000-PiPort (which targets the 2.8" board) - see DEVLOG.md.

[env:pipboy]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- hardware: 16MB quad flash + 8MB octal PSRAM (ESP32-S3R8 module, confirmed from
; Waveshare's own demo package for this board)
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; XPowersLib drives the AXP2101 PMU chip that powers this board's rails and
; battery/power-key management (see power.cpp) - unlike the 2.8" board, power
; here is not a couple of raw GPIOs, so we lean on Waveshare's own tested
; library rather than hand-transcribing rail voltages (getting one wrong can
; overvolt a rail).
; AnimatedGIF (bitbank2) decodes the boot animation GIF frame-by-frame at
; runtime rather than pre-expanding it to raw pixels (60 frames at 480x320
; would be tens of MB uncompressed, far past this board's flash) - see
; boot_anim.h/ui_screens.cpp.
lib_deps =
    lewisxhe/XPowersLib@^0.2.9
    bitbank2/AnimatedGIF@^2.2.0

monitor_speed = 115200
upload_port = COM31
monitor_port = COM31
upload_speed = 115200
upload_flags = --no-stub
